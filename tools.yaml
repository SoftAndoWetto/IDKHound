# Manifest of every third-party tool the orchestrator installs, updates, and
# invokes. All paths are relative to tools_root. Adding a new tool means
# adding an entry here - no orchestrator code changes required.

tools_root: tools

tools:
#  bloodhound-py:
#    kind: python-venv
#    path: BloodHound.py
#    venv: venv
#    entry: bloodhound.py
#    repo: https://github.com/dirkjanm/BloodHound.py.git
#    branch: bloodhound-ce
#    version_cmd: ["--version"]
#    update: ["git checkout bloodhound-ce", "git pull", "pip install ."]
#    command_template: "-d {domain} -u {username} -p {password} -ns {dc_ip} --zip"
#    Until this 1) gets an outpit dir flag and 2) isnt on a branch that isnt master, im not implementing it

  rusthound-ce:
    kind: cargo-binary
    path: RustHound-CE
    binary: target/release/rusthound-ce
    repo: https://github.com/g0h4n/RustHound-CE
    version_cmd: ["--version"]
    update: [git pull, "cargo build --release"]
    command_template: "-d {domain} -u {username} -p {password} -i {dc_ip} -o {output_dir} --zip"

  mssqlhound:
    kind: go-binary
    path: MSSQLHound
    binary: mssqlhound
    repo: "https://github.com/SpecterOps/MSSQLHound"
    version_cmd: ["--version"]
    update: [git pull, "go build -o mssqlhound ./cmd/mssqlhound"]
    command_template: "-d {domain} -u {username} -p {password} --dc {dc_ip} -A --zip-dir {output_dir}"

  scomhound:
    kind: python-venv
    path: SCOMHound
    venv: venv
    entry: scomhound.py
    repo: "https://github.com/SpecterOps/SCOMHound"
    version_cmd: [""]  # No version tag
    update: [git pull, "venv/bin/pip install ."]
    command_template: "-d {domain} -u {username} -p {password} -dc-ip {dc_ip}"

  gpohound:
    kind: python-venv
    path: GPOHound
    venv: venv
    entry: gpohound.py
    repo: "https://github.com/cogiceo/GPOHound"
    version_cmd: [""]  # No version tag
    update: [git pull, "venv/bin/pip install ."]
    command_template: "ldap -d {domain} -u {username} -p {password} -dc-ip {dc_ip}"

  gpoparser:
    kind: python-venv-installed
    path: gpoParser
    venv: venv
    binary: gpoParser
    repo: "https://github.com/synacktiv/gpoParser"
    version_cmd: [""]  # No version tag
    update: [git pull, "venv/bin/pip install ."]
    # Uses 'remote' subcommand
    command_template: "remote -d {domain} -u {username} -p {password} -dc-ip {dc_ip}"

  certihound:
    kind: python-venv-editable
    path: certihound
    venv: venv
    binary: certihound
    repo: "https://github.com/0x0Trace/Certihound"
    version_cmd: ["--version"]
    update: [git pull, "venv/bin/pip install -e ."]
    command_template: "-d {domain} -u {username} -p {password} -dc-ip {dc_ip}"

  sharehound:
    kind: go-binary
    path: sharehound
    binary: sharehound
    repo: "https://github.com/jazofra/sharehound"
    version_cmd: ["--version"]
    update: [git pull, "go build -C Go -o ../sharehound ./cmd/sharehound"]
    command_template: "--auth-domain {domain} --auth-user {username} --auth-password {password} --auth-dc-ip {dc_ip} --subnets -o {output_dir}/sharehound.zip"

  bloodhound-automation:
    kind: python-venv-requirements
    path: bloodhound-automation
    repo: "https://github.com/Tanguy-Boisset/bloodhound-automation"
    venv: venv
    entry: bloodhound-automation.py
    version_args: null   # meta tool - no version check, skipped by installer
