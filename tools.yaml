  NetworkHound:
    kind: python-venv
    path: NetworkHound
    venv: venv
    entry: NetworkHound.py
    repo: https://github.com/MorDavid/NetworkHound
    version_cmd: ["--version"]
    install:
      - "python3 -m venv {venv}"
      - "{pip} install -r requirements.txt"
    update: ["{pip} install ."]
    command_template: "--dc {dc_ip} -d {domain} -u {username} -p {password} -o {output_dir} --shadow-it --port-scan --valid-http --ssl --valid-smb --scan-threads 50"

  bloodhound-automation:
    kind: python-venv-requirements
    path: bloodhound-automation
    repo: "https://github.com/Tanguy-Boisset/bloodhound-automation"
    venv: venv
    entry: bloodhound-automation.py
    install:
      - "python3 -m venv {venv}"
      - "{pip} install -r requirements.txt"
    version_args: null   # meta tool - no version check, skipped by installer
