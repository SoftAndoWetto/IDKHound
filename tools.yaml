# Manifest of every third-party tool the orchestrator installs, updates, and
# invokes. All paths are relative to tools_root. Adding a new tool means
# adding an entry here - no orchestrator code changes required.

tools_root: tools

tools:
  bloodhound-py:
    kind: python-venv
    path: BloodHound.py
    venv: venv
    entry: bloodhound.py
    repo: https://github.com/SoftAndoWetto/BloodHound.py/
    branch: bloodhound-ce
    version_cmd: ["--version"]
    install:
      - "git checkout bloodhound-ce"
      - "python3 -m venv {venv}"
      - "{pip} install ."
    update: ["git checkout bloodhound-ce", "git pull", "{pip} install ."]
    # NOTE: bloodhound.py itself has no --output-dir flag, it just writes
    # zips/json into whatever the cwd is when it's invoked. The 'install'
    # field above only fixes the *install* (branch + venv), it does not
    # fix that runtime limitation - runner.py would need a per-tool cwd
    # (probably {output_dir}) before this can safely run alongside other
    # jobs without clobbering/mixing output.
    command_template: "-d {domain} -u {username} -p {password} -ns {dc_ip} --dns-tcp -o {output_dir}/bloodhound.zip"

  rusthound-ce:
    kind: cargo-binary
    path: RustHound-CE
    binary: target/release/rusthound-ce
    repo: https://github.com/g0h4n/RustHound-CE
    version_cmd: ["--version"]
    install:
      - "cargo build --release"
    update: [git pull, "cargo build --release"]
    command_template: "-d {domain} -u {username} -p {password} -i {dc_ip} -o {output_dir} --zip"

  mssqlhound:
    kind: go-binary
    path: MSSQLHound
    binary: mssqlhound
    repo: "https://github.com/SpecterOps/MSSQLHound"
    version_cmd: ["--version"]
    install:
      - "go build -o {binary} ./cmd/mssqlhound"
    update: [git pull, "go build -o mssqlhound ./cmd/mssqlhound"]
    command_template: "-d {domain} -u {username} -p {password} --dc {dc_ip} -A --zip-dir {output_dir}"

  scomhound:
    kind: python-venv
    path: SCOMHound
    venv: venv
    entry: scomhound.py
    repo: "https://github.com/SpecterOps/SCOMHound"
    version_cmd: [""]  # No version tag
    install:
      - "python3 -m venv {venv}"
      - "{pip} install ."
    update: [git pull, "venv/bin/pip install ."]
    command_template: "-d {domain} -u {username} -p {password} -dc-ip {dc_ip}"

  gpohound:
    kind: python-venv
    path: GPOHound
    venv: venv
    entry: gpohound.py
    repo: "https://github.com/SoftAndoWetto/GPOHound"
    version_cmd: [""]   #No version tag
    install:
      - "python3 -m venv {venv}"
      - "{pip} install -e ."
    update: [git pull, "venv/bin/pip install ."]
    command_template: "full -d {domain} -u {username} -p {password} --dc {dc_ip} --output-dir {output_dir} --zip-name gpohound.zip"

  certihound:
    kind: python-venv-editable
    path: certihound
    venv: venv
    binary: certihound
    repo: "https://github.com/0x0Trace/Certihound"
    version_cmd: ["--version"]
    install:
      - "python3 -m venv {venv}"
      - "{pip} install -e ."
    update: [git pull, "venv/bin/pip install -e ."]
    command_template: "-d {domain} -u {username} -p {password} --dc {dc_ip} -o {output_dir} --format zip"

