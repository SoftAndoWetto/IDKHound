  ConfigManBearPig:
    kind: python-venv
    path: ConfigManBearPig
    venv: venv
    entry: python/configmanbearpig.py
    repo: https://github.com/SpecterOps/ConfigManBearPig.git
    branch: python
    version_cmd: ["--version"]
    sudo: true
    install:
      - "git checkout python"
      - "python3 -m venv {venv}"
      - "{pip} install python/."
    update: ["git checkout python", "git pull", "{pip} install python/."]
    # Note the double backslash here: \\{username}
    command_template: "-d {domain} -dc {dc_ip} -u '{domain}\\{username}' -p {password} -m All -o {output_dir}"

