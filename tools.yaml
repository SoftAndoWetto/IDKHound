    command_template: "-d {domain} -u {username} -p {password} -dc {dc_ip} --zip -o {output_dir}"


# Note: I think I also need LDAPS flag (optional) for every tool and exclude those that dont have one when the flag is specified

  bloodhound-automation:
    kind: python-venv-requirements
    path: bloodhound-automation
    repo: "https://github.com/Tanguy-Boisset/bloodhound-automation"
    venv: venv
    entry: bloodhound-automation.py
    install:
      - "python3 -m venv {venv}"
      - "{pip} install -r requirements.txt"
    version_args: null   # meta tool - no version check, skipped by installer